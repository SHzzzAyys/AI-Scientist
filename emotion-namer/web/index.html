<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>情绪命名器</title>

<!-- 字体全部内置在本地 web/fonts/,离线可用,不依赖任何 CDN(与冷静期信封同一套) -->
<link rel="stylesheet" href="fonts/fonts.css" />
<style>
:root{
  /* —— 与家族同一套 Cream Workshop 配色 —— */
  --cream:      #F4ECD8;
  --cream-card: #FAF4E4;
  --ink:        #1F1B16;
  --ink-soft:   #756A59;
  --clay:       #C25E37;
  --clay-deep:  #9C4326;
  --clay-bright:#DA7A52;
  --line:       #E4D9BF;

  /* 六类情绪各自的低饱和色相,落在同一张暖纸上 */
  --c-anger: #C25E37;
  --c-sad:   #5E7790;
  --c-fear:  #8A6FA6;
  --c-joy:   #D39A3C;
  --c-calm:  #5E8A6B;
  --c-shame: #B06A82;

  --serif: "Fraunces", "LXGW WenKai", Georgia, serif;
  --hand:  "LXGW WenKai", "Source Han Serif SC", "Songti SC", serif;
  --mono:  "IBM Plex Mono", ui-monospace, monospace;
}

*{ box-sizing:border-box; }

body{
  margin:0; min-height:100vh;
  font-family:var(--hand); color:var(--ink);
  background:radial-gradient(120% 90% at 50% -10%, #FBF5E6 0%, var(--cream) 55%, #EFE6CF 100%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased; position:relative;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}

.wrap{ position:relative; z-index:1; max-width:600px; margin:0 auto; padding:48px 22px 80px; }

header{ text-align:center; margin-bottom:34px; }
.kicker{ font-family:var(--mono); font-size:11px; letter-spacing:.28em; text-transform:uppercase; color:var(--clay); margin-bottom:14px; }
h1{ font-family:var(--serif); font-weight:400; font-size:clamp(34px,7vw,46px); margin:0; letter-spacing:.01em; }
.lede{ font-family:var(--hand); color:var(--ink-soft); font-size:16px; margin:14px auto 0; max-width:36ch; line-height:1.7; }

.desk{
  background:var(--cream-card); border:1px solid var(--line); border-radius:4px;
  padding:26px 24px 22px;
  box-shadow:0 1px 0 #fff inset, 0 18px 38px -28px rgba(31,27,22,.5); position:relative;
}
.field-label{ font-family:var(--mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-soft); display:block; margin:0 0 8px; }
textarea, input[type=text]{
  width:100%; background:transparent; border:none; color:var(--ink);
  font-family:var(--hand); font-size:18px; line-height:1.65; resize:none;
  border-bottom:1.5px solid var(--line); padding:2px 0 8px; outline:none; transition:border-color .25s;
}
textarea::placeholder, input::placeholder{ color:#BCB29A; }
textarea:focus, input:focus{ border-color:var(--clay); }
textarea{ min-height:62px; }

/* —— 情绪词库(平铺的“词轮”) —— */
.wheel{ margin-top:24px; }
.fam{ margin-top:16px; }
.fam-name{ font-family:var(--mono); font-size:11px; letter-spacing:.14em; color:var(--ink-soft); display:flex; align-items:center; gap:7px; margin-bottom:9px; }
.fam-dot{ width:9px; height:9px; border-radius:50%; flex:none; }
.words{ display:flex; flex-wrap:wrap; gap:8px; }
.word{
  font-family:var(--hand); font-size:15px; color:var(--ink-soft);
  background:transparent; border:1.4px solid var(--line); border-radius:999px;
  padding:7px 15px; cursor:pointer; transition:.16s; line-height:1;
}
.word:hover{ border-color:var(--fc, var(--clay)); color:var(--ink); }
.word[aria-pressed=true]{ background:var(--fc,var(--clay)); border-color:var(--fc,var(--clay)); color:#FBF5E6; }

/* —— 强度 —— */
.intensity{ margin-top:24px; display:flex; align-items:center; gap:14px; }
.dots{ display:flex; gap:10px; }
.dot{ width:18px; height:18px; border-radius:50%; border:1.6px solid var(--line); cursor:pointer; transition:.15s; background:transparent; }
.dot.on{ background:var(--clay); border-color:var(--clay); }
.dot:hover{ border-color:var(--clay); }
.intensity .hint{ font-family:var(--hand); font-size:13.5px; color:var(--ink-soft); }

.why-wrap{ margin-top:22px; }

.name-btn{
  margin-top:26px; width:100%; font-family:var(--serif); font-size:17px; letter-spacing:.04em;
  color:#FBF5E6; background:var(--clay); border:none; border-radius:3px; padding:14px;
  cursor:pointer; transition:.2s; box-shadow:0 10px 22px -14px var(--clay-deep);
}
.name-btn:hover{ background:var(--clay-deep); transform:translateY(-1px); }

/* —— 命名簿 —— */
.book-head{ display:flex; align-items:baseline; justify-content:space-between; margin:50px 2px 18px; }
.book-head h2{ font-family:var(--serif); font-weight:400; font-size:22px; margin:0; }
.book-head .count{ font-family:var(--mono); font-size:11px; color:var(--ink-soft); letter-spacing:.1em; }
.empty{ text-align:center; color:var(--ink-soft); font-size:15px; padding:34px 10px; line-height:1.8; }

.book{ display:flex; flex-direction:column; gap:16px; }
.entry{
  position:relative; background:var(--cream-card); border:1px solid var(--line);
  border-radius:5px; padding:20px 20px 18px;
  box-shadow:0 14px 30px -26px rgba(31,27,22,.55);
  animation:drop .5s cubic-bezier(.2,.9,.25,1) both;
}
@keyframes drop{ from{ opacity:0; transform:translateY(-10px) scale(.985); } }
.entry .top{ display:flex; align-items:center; justify-content:space-between; }
.entry .date{ font-family:var(--mono); font-size:10.5px; letter-spacing:.16em; color:var(--ink-soft); }
.entry .del{ font-family:var(--mono); font-size:16px; line-height:1; color:#C9BCA0; background:none; border:none; cursor:pointer; padding:2px 4px; transition:.15s; }
.entry .del:hover{ color:var(--clay-deep); }
.entry .tags{ display:flex; flex-wrap:wrap; gap:7px; margin-top:11px; }
.tag{ font-family:var(--hand); font-size:14px; color:#FBF5E6; border-radius:999px; padding:5px 13px; line-height:1; background:var(--clay); }
.entry .meter{ display:flex; gap:7px; margin-top:12px; }
.entry .meter .d{ width:13px; height:13px; border-radius:50%; border:1.4px solid var(--line); }
.entry .meter .d.on{ background:var(--clay); border-color:var(--clay); }
.entry .body{ font-family:var(--serif); font-size:18px; line-height:1.5; margin:14px 0 0; }
.entry .why{ margin-top:12px; padding-top:11px; border-top:1px dashed var(--line); }
.entry .why .t{ font-family:var(--mono); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-soft); }
.entry .why .b{ font-family:var(--hand); font-size:15.5px; color:var(--ink); margin-top:5px; line-height:1.7; }

footer{ margin-top:40px; text-align:center; }
.footnote{ font-family:var(--hand); font-size:12.5px; color:#A99E86; line-height:1.7; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="kicker">a quiet tool · 02</div>
    <h1>情绪命名器</h1>
    <p class="lede">给说不清的情绪一个准确的名字。命名得越准,它越松手。</p>
  </header>

  <section class="desk">
    <label class="field-label" for="body">此刻发生了什么 · 身体里是什么感觉</label>
    <textarea id="body" placeholder="刚收到那条消息,胸口一紧,手有点凉……"></textarea>

    <div class="wheel" id="wheel">
      <span class="field-label">挑出贴近的词(可多选)</span>
      <!-- 各情绪族在这里渲染 -->
    </div>

    <div class="intensity">
      <span class="field-label" style="margin:0;">强度</span>
      <div class="dots" id="dots"></div>
      <span class="hint" id="intHint">还没标</span>
    </div>

    <div class="why-wrap">
      <label class="field-label" for="why">为什么是这个词(可留空)</label>
      <input type="text" id="why" placeholder="一句话,写下此刻的来由" />
    </div>

    <button class="name-btn" id="nameBtn">命 名</button>
  </section>

  <div class="book-head">
    <h2>命名簿</h2>
    <span class="count" id="count"></span>
  </div>
  <div class="book" id="book"></div>
  <p class="empty" id="empty">命名簿还是空的。<br/>给此刻的情绪起第一个名字。</p>

  <footer>
    <p class="footnote">所有命名都加密存在本地,只有你看得到。</p>
  </footer>

</div>

<script>
/* ───────── 与 Python 内核的桥 ───────── */
function pywebviewReady(){
  return new Promise(res => {
    if (window.pywebview && window.pywebview.api) return res();
    window.addEventListener("pywebviewready", () => res(), { once:true });
  });
}

/* —— 情绪词库 —— */
const FAMILIES = [
  { key:"anger", name:"愤怒", color:"var(--c-anger)", words:["恼火","不甘","委屈","愤懑","烦躁","被冒犯"] },
  { key:"sad",   name:"悲伤", color:"var(--c-sad)",   words:["失落","孤独","想念","怅惘","沉重","无力"] },
  { key:"fear",  name:"恐惧", color:"var(--c-fear)",  words:["不安","焦虑","发慌","担心","胆怯","提防"] },
  { key:"joy",   name:"喜悦", color:"var(--c-joy)",   words:["雀跃","踏实","被看见","期待","温暖","松快"] },
  { key:"calm",  name:"平静", color:"var(--c-calm)",  words:["安定","释然","清明","满足","笃定","留白"] },
  { key:"shame", name:"羞愧", color:"var(--c-shame)", words:["难为情","自责","局促","想躲","懊恼","不配得"] },
];
/* 词 -> 所属族颜色,渲染命名簿标签时用 */
const WORD_COLOR = {};
FAMILIES.forEach(f => f.words.forEach(w => WORD_COLOR[w] = f.color));

let entries = [];
let intensity = 0;

function esc(s){ return (s || "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(t){
  const d = new Date(t), p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* —— 渲染词轮 —— */
const wheel = document.getElementById("wheel");
FAMILIES.forEach(f => {
  const g = document.createElement("div");
  g.className = "fam";
  g.innerHTML =
    `<div class="fam-name"><span class="fam-dot" style="background:${f.color}"></span>${f.name}</div>
     <div class="words">${f.words.map(w =>
        `<button class="word" style="--fc:${f.color}" data-w="${esc(w)}" aria-pressed="false">${esc(w)}</button>`
      ).join("")}</div>`;
  wheel.appendChild(g);
});
wheel.addEventListener("click", e => {
  const b = e.target.closest(".word"); if(!b) return;
  b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true");
});
function chosenWords(){
  return [...wheel.querySelectorAll('.word[aria-pressed="true"]')].map(b => b.dataset.w);
}

/* —— 强度圆点 —— */
const dotsEl = document.getElementById("dots");
const intHint = document.getElementById("intHint");
const INT_WORDS = ["", "很轻", "有点", "明显", "挺强", "很强"];
for (let i = 1; i <= 5; i++){
  const d = document.createElement("button");
  d.className = "dot"; d.dataset.v = i;
  d.addEventListener("click", () => setIntensity(i));
  dotsEl.appendChild(d);
}
function setIntensity(v){
  intensity = (intensity === v) ? 0 : v;   // 再点一次取消
  [...dotsEl.children].forEach(d => d.classList.toggle("on", +d.dataset.v <= intensity));
  intHint.textContent = intensity ? INT_WORDS[intensity] : "还没标";
}

/* —— 命名 —— */
document.getElementById("nameBtn").addEventListener("click", async () => {
  const words = chosenWords();
  if (!words.length){ document.querySelector(".word")?.focus(); wheel.scrollIntoView({behavior:"smooth", block:"center"}); return; }
  const body = document.getElementById("body").value.trim();
  const why  = document.getElementById("why").value.trim();
  await window.pywebview.api.save(body, words, intensity, why);
  // 清场
  document.getElementById("body").value = "";
  document.getElementById("why").value = "";
  wheel.querySelectorAll('.word[aria-pressed="true"]').forEach(b => b.setAttribute("aria-pressed","false"));
  setIntensity(0);
  refresh();
});

/* —— 渲染命名簿 —— */
const book = document.getElementById("book");
const empty = document.getElementById("empty");
const count = document.getElementById("count");

function meterHTML(n){
  let s = "";
  for (let i = 1; i <= 5; i++) s += `<span class="d${i <= n ? " on":""}"></span>`;
  return s;
}
function render(){
  book.innerHTML = "";
  empty.style.display = entries.length ? "none" : "block";
  count.textContent = entries.length ? `${entries.length} 次` : "";
  entries.forEach(en => {
    const el = document.createElement("div");
    el.className = "entry";
    const tags = (en.words || []).map(w =>
      `<span class="tag" style="background:${WORD_COLOR[w] || 'var(--clay)'}">${esc(w)}</span>`).join("");
    el.innerHTML = `
      <div class="top">
        <span class="date">${fmtDate(en.createdAt)} 命名</span>
        <button class="del" title="删除" data-id="${en.id}">×</button>
      </div>
      <div class="tags">${tags}</div>
      ${en.intensity ? `<div class="meter">${meterHTML(en.intensity)}</div>` : ""}
      ${en.body ? `<p class="body">${esc(en.body)}</p>` : ""}
      ${en.why ? `<div class="why"><div class="t">来由</div><div class="b">${esc(en.why)}</div></div>` : ""}
    `;
    book.appendChild(el);
  });
}
book.addEventListener("click", async e => {
  const b = e.target.closest(".del"); if(!b) return;
  await window.pywebview.api.delete(b.dataset.id);
  refresh();
});

async function refresh(){
  try { entries = await window.pywebview.api.list(); } catch(e){ /* ignore */ }
  render();
}

/* —— 启动 —— */
(async function init(){
  await pywebviewReady();
  await refresh();
})();
</script>
</body>
</html>
